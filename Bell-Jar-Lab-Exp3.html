<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bell Jar Lab Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-bench scene as the hero (16:10), procedure + feedback rail on the right; stacks on narrow screens */
:root{
  --bg:#e7e9e4; --surface:#f7f8f5; --surface-2:#eef0eb; --ink:#1b2124; --muted:#5b6569; --line:#cdd2cb;
  --accent:#e0aa10; --accent-ink:#6e5300; --warn:#b8620f; --warn-bg:#fbefdf; --danger:#b3302a; --danger-bg:#f9e3e1;
  --ok:#2b7a4d; --ok-bg:#e2f1e7; --no2:#8a4a1c; --scene:#16191c;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111416; --surface:#1a1f22; --surface-2:#20262a; --ink:#e6eae5; --muted:#9aa4a7; --line:#2d3439;
  --accent:#f2c230; --accent-ink:#f2c230; --warn:#f0a04b; --warn-bg:#2f2416; --danger:#ef6b5e; --danger-bg:#331b19;
  --ok:#5cc489; --ok-bg:#16291f; --no2:#d08a4f; --scene:#0d0f11; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111416; --surface:#1a1f22; --surface-2:#20262a; --ink:#e6eae5; --muted:#9aa4a7; --line:#2d3439;
  --accent:#f2c230; --accent-ink:#f2c230; --warn:#f0a04b; --warn-bg:#2f2416; --danger:#ef6b5e; --danger-bg:#331b19;
  --ok:#5cc489; --ok-bg:#16291f; --no2:#d08a4f; --scene:#0d0f11; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
#root{padding-block:12px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:12px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:600 13px var(--f-body);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--f-body);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1050px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;background:var(--scene);border-radius:12px;overflow:hidden;aspect-ratio:16/10;max-width:100%;box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.12)}
.stage svg{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.zoombar{position:absolute;top:10px;left:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px)}
.zoombar button{border:1px solid rgba(255,255,255,.18);background:rgba(18,21,24,.78);color:#eef0ea;font:600 12px var(--f-body);padding:6px 10px;border-radius:7px;cursor:pointer;backdrop-filter:blur(6px)}
.zoombar button[aria-pressed="true"]{background:#f2c230;color:#1b1b16;border-color:#f2c230}
.zoombar button:focus-visible{outline:2px solid #f2c230;outline-offset:2px}
.status{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:9px 2px 0;min-height:30px;color:var(--muted);font-size:13px}
.status b{color:var(--ink);font-weight:600}
.status .clock{margin-left:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.toasts{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 20px));pointer-events:none}
.toast{pointer-events:auto;background:rgba(250,248,240,.97);color:#1b2124;border-radius:9px;padding:10px 12px 10px 14px;border-left:5px solid #b8620f;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px;animation:tin .25s ease-out}
.toast.info{border-left-color:#3d6f8f}.toast.ok{border-left-color:#2b7a4d}
.toast h4{margin:0 0 2px;font:700 14px var(--f-body)}
.toast p{margin:0}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.1}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps .sec{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 0 4px}
.steps .sec:first-child{padding-top:0}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:6px 6px;border-radius:8px;font-size:13px}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-mono);border:1.5px solid var(--line);color:var(--muted)}
.step.done{color:var(--muted)}
.step.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.cur{background:var(--surface-2);color:var(--ink)}
.step.cur .n{border-color:var(--accent);background:var(--accent);color:#1b1b16}
.step .hint{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.hidden-note{color:var(--muted);font-size:13px;margin:0}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.log li{font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--surface-2);border-left:4px solid var(--line)}
.log li.warn{background:var(--warn-bg);border-left-color:var(--warn)}
.log li.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.log li b{display:block;font-size:13px}
.log .t{float:right;font-family:var(--f-mono);color:var(--muted);font-size:11px;margin-left:8px}
.empty{color:var(--muted);font-size:13px;margin:0}
.equil .bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:8px 0}
.equil .bar i{display:block;height:100%;background:var(--no2)}
.equil .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.toggles{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.modal-back{position:fixed;inset:0;background:rgba(10,12,14,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);border-top:6px solid var(--accent)}
.modal.bad{border-top-color:var(--danger)} .modal.good{border-top-color:var(--ok)}
.modal h3{font-family:var(--f-display);font-size:28px;font-weight:700;margin:0 0 8px;line-height:1.05;text-wrap:balance}
.modal p{margin:0 0 10px}
.modal ul{margin:6px 0 14px;padding-left:18px}
.modal li{margin:4px 0}
.modal .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.modal .fix{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.mistakes{list-style:none;padding:0!important}
.mistakes li{background:var(--warn-bg);border-left:4px solid var(--warn);border-radius:8px;padding:8px 10px}
.mistakes li.skip{background:var(--surface-2);border-left-color:var(--muted)}
/* scene */
.part{cursor:pointer;outline:none}
.part:hover,.part:focus-visible{filter:drop-shadow(0 0 4px rgba(255,210,80,.95)) drop-shadow(0 0 1px rgba(255,210,80,.95))}
.mv{transform-box:view-box;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.mv.slow{transition-duration:.85s}
.spinbar{transform-box:fill-box;transform-origin:center;animation:spinbar .32s linear infinite}
@keyframes spinbar{0%{transform:scaleX(1)}50%{transform:scaleX(.12)}100%{transform:scaleX(1)}}
.bub{transform-box:fill-box;animation:rise 1.1s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.95}100%{transform:translateY(-24px);opacity:0}}
.flow{stroke-dasharray:5 11;animation:dash .55s linear infinite}
.flow.rev{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-16}}
.slbl{font-family:var(--f-display);font-weight:600;font-size:17px;fill:#f3efe2;paint-order:stroke;stroke:#101214;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.slbl.sm{font-size:14px}
@media (prefers-reduced-motion: reduce){.mv{transition:none}.spinbar,.bub,.flow,.toast{animation:none}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>

<script>
const {useState,useEffect,useRef} = React;
const html = htm.bind(React.createElement);

/* ---------------- Physical model ----------------
   Gas amounts are tracked in "mL at 760 mm Hg". Segments:
   J  bell jar + its tubing (incl. tee to sensor)   S  sensor dead volume
   H  3-way valve hub                               VL vacuum line (stopcock → house valve)
   I  injection line (stopcock → port)              b = amount of NO2 mixture (brown) in each */
const VOL = {J:1000, S:6, H:3, VL:60, I:2};
const SEGS = ['J','S','H','VL','I'];
const CON = {atm:2.0, pump:0.237, syr:0.02, leak:0.0002, vlLeak:0.004};
const P_PUMP = 15, P_VAPOR = 24, GAS0 = 30;
const DIRS = ['up','right','down','left'];
const offDir = a => DIRS[(((Math.round(a/90)) % 4) + 4) % 4];
const pJ = s => 760 * s.seg.J.n / VOL.J;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function initState(){
  const seg = {}; SEGS.forEach(k => seg[k] = {n:VOL[k], b:0});
  return { loggerOpen:false, water:0, stirBar:false, beaker:'bench', jarLifted:false, heat:false, stir:false,
    sensStop:false, vacStop:false, injStop:false, angle:0, houseVac:false, sensorOn:true,
    syringe:'bench', synStop:false, synGas:GAS0, seg, t:0, hist:[], histT:0,
    latched:{}, warned:{}, log:[], serious:null, complete:false, equil:0, pumpLow:0, vacIdle:0, emptyOpen:0,
    wasPumping:false, gasIn:false, reached40:false, prevP:760, lostVac:0, lostAtm:{}, boilNoted:false, info:null, noise:0 };
}

function topo(s){
  const off = offDir(s.angle), E = [];
  if (off !== 'up') E.push(['J','H']);
  if (off !== 'down' && s.vacStop) E.push(['H','VL']);
  if (off !== 'right' && s.injStop) E.push(['H','I']);
  if (s.sensStop && s.sensorOn) E.push(['J','S']);
  const src = {J:[],S:[],H:[],VL:[],I:[]};
  src.J.push({k:'leak', C:CON.leak, P:760});
  if (s.jarLifted) src.J.push({k:'jar', C:CON.atm, P:760});
  if (s.sensStop && !s.sensorOn) src.J.push({k:'sensorEnd', C:CON.atm, P:760});
  src.VL.push(s.houseVac ? {k:'pump', C:CON.pump, P:P_PUMP} : {k:'vlLeak', C:CON.vlLeak, P:760});
  if (s.syringe !== 'port') src.I.push({k:'port', C:CON.atm, P:760});
  else if (s.synStop && s.synGas > 0.01) src.I.push({k:'syr', C:CON.syr, P:760});
  return {E, src};
}
function groupsOf(s, E){
  const par = {}; SEGS.forEach(k => par[k] = k);
  const f = k => par[k] === k ? k : (par[k] = f(par[k]));
  E.forEach(([a,b]) => { par[f(a)] = f(b); });
  const g = {};
  SEGS.forEach(k => { if (k === 'S' && !s.sensorOn) return; (g[f(k)] = g[f(k)] || []).push(k); });
  return {g, f};
}
function connected(s, a, b){ const {E} = topo(s); const {f} = groupsOf(s, E); return f(a) === f(b); }

function simStep(s, dt){
  const {E, src} = topo(s);
  const {g} = groupsOf(s, E);
  const info = {compOf:{}, kinds:{}, flow:{}, lostVac:0, lostAtm:{}, syrIn:0};
  const wetJar = s.beaker === 'jar' && s.water > 0 && !s.jarLifted;
  for (const root in g){
    const mem = g[root];
    let N = 0, B = 0, V = 0;
    mem.forEach(k => { N += s.seg[k].n; B += s.seg[k].b; V += VOL[k]; });
    const P = 760 * N / V, hasJ = mem.includes('J');
    const srcs = []; mem.forEach(k => src[k].forEach(x => srcs.push({...x})));
    srcs.forEach(x => { if (x.k === 'pump' && hasJ && wetJar) x.P = P_VAPOR; });
    const act = srcs.filter(x => !(x.k === 'syr' && P >= 759.5));
    let dN = 0;
    if (act.length){
      const ks = act.map(x => x.C * 760 / V), kt = ks.reduce((a,b) => a+b, 0);
      const Pt = act.reduce((a,x,i) => a + ks[i]*x.P, 0) / kt;
      const Pn = Pt + (P - Pt) * Math.exp(-kt*dt);
      const dTot = (Pn - P) * V / 760;
      const w = act.map((x,i) => ks[i]*(x.P - P)), W = w.reduce((a,b) => a+b, 0);
      act.forEach((x,i) => {
        let dn = Math.abs(W) > 1e-9 ? dTot*w[i]/W : 0;
        if (x.k === 'syr'){ dn = clamp(dn, 0, s.synGas); s.synGas -= dn; B += dn; N += dn; dN += dn; info.syrIn += dn; return; }
        if (dn < 0){
          const lb = -dn * (N > 0 ? B/N : 0); B -= lb;
          if (x.k === 'pump' || x.k === 'vlLeak') info.lostVac += lb;
          else if (x.k !== 'leak') info.lostAtm[x.k] = (info.lostAtm[x.k] || 0) + lb;
        }
        N += dn; dN += dn;
      });
    }
    if (hasJ && wetJar && B > 0){           // NO2 dissolving into the stirred water
      const r = (s.stir && s.stirBar) ? 0.006 : 0.0015;
      const db = B * (1 - Math.exp(-r*dt)); B -= db; N -= db;
    }
    N = Math.max(N, 0.001); B = clamp(B, 0, N);
    mem.forEach(k => { s.seg[k].n = N*VOL[k]/V; s.seg[k].b = B*VOL[k]/V; info.compOf[k] = root; });
    info.kinds[root] = srcs.map(x => x.k);
    info.flow[root] = dN / dt;
  }
  return info;
}
const boilLevel = s => (s.beaker === 'jar' && s.water > 0 && !s.jarLifted) ? clamp((42 - pJ(s)) / 14, 0, 1) : 0;
const reading = s => s.sensorOn ? 760 * s.seg.S.n / VOL.S : null;

/* ---------------- Procedure ---------------- */
const SECTIONS = ['Initial bell jar apparatus','Evacuation of the bell jar','Introduction of gas mixture','Reaction equilibration'];
const STEPS = [
  {sec:0, text:'Open Logger Pro (Exp4AcidRain). All tubing starts closed.', hint:'Click the computer monitor.', done:s=>s.loggerOpen},
  {sec:0, text:'Fill the 30 mL beaker with 15 mL distilled water and add a stir bar.', hint:'Click the wash bottle, then the stir bar.', done:s=>s.water>0&&s.stirBar},
  {sec:0, text:'Put the beaker under the bell jar and turn on ONLY the stirrer.', hint:'Click the bell jar to lift it, click the beaker, click the jar again to seat it. Then click the STIR knob.', done:s=>s.beaker==='jar'&&!s.jarLifted&&s.stir&&!s.heat},
  {sec:0, text:'Open the stopcock so the path from the bell jar to the gas pressure sensor is open.', hint:'Click the white stopcock on top of the sensor. Vertical handle = open.', done:s=>s.sensStop&&s.sensorOn},
  {sec:1, text:'Adjust the three-way valve so all paths are open.', hint:'Click the yellow handle until OFF points at the side with no port.', done:s=>offDir(s.angle)==='left'},
  {sec:1, text:'Open the vacuum and pump the bell jar down to 30–40 mm Hg, or until the water boils.', hint:'Open the stopcock under the 3-way valve, then turn the house vacuum handle. Watch Logger Pro.', done:s=>s.reached40},
  {sec:1, text:'Close the three-way valve to the vacuum AND the stopcock to the vacuum. Make sure the pressure is not rising quickly.', hint:'Turn the yellow handle so OFF points down at the vacuum line, then close the vacuum stopcock.', done:s=>s.reached40&&offDir(s.angle)==='down'&&!s.vacStop},
  {sec:1, text:'Turn off the vacuum.', hint:'Click the house vacuum handle.', done:s=>s.reached40&&!s.houseVac},
  {sec:1, text:'Close the stopcock to the gas pressure sensor.', hint:'Horizontal handle = closed.', done:s=>s.reached40&&!s.sensStop},
  {sec:1, text:'Disconnect the gas pressure sensor.', hint:'Click the sensor box.', done:s=>s.reached40&&!s.sensorOn},
  {sec:2, text:'Check that the injection-port stopcock is closed and the 3-way valve is open from the injection port to the bell jar.', hint:'OFF should point down at the vacuum line.', done:s=>s.reached40&&!s.injStop&&offDir(s.angle)==='down'},
  {sec:2, text:'Connect the syringe of NO₂ gas mixture to the injection port.', hint:'Click the syringe.', done:s=>s.syringe==='port'||s.gasIn},
  {sec:2, text:'Open the syringe stopcock and the injection-port stopcock. The gas is drawn into the bell jar.', hint:'Click both white stopcocks so their handles are vertical.', done:s=>s.gasIn},
  {sec:2, text:'Close both stopcocks quickly so the reaction happens only in the bell jar.', hint:'Horizontal handles = closed.', done:s=>s.gasIn&&!s.synStop&&!s.injStop},
  {sec:2, text:'Disconnect the syringe.', hint:'Click the syringe.', done:s=>s.gasIn&&s.syringe!=='port'},
  {sec:3, text:'Stir and equilibrate for 5–10 minutes.', hint:'Keep the stirrer on. Use 20× speed to skip ahead.', done:s=>s.complete},
];

const WARN = {
  heat:{t:'Hot plate turned on', x:'Only the stirrer should be on. Heating the water under vacuum makes it boil hard and changes your result. Turn the HEAT knob back off.', step:3},
  noLogger:{t:'Logger Pro isn’t open', x:'Open Logger Pro first (step 1) so you can watch the pressure while you evacuate.', step:1},
  noBeaker:{t:'Evacuating without the beaker', x:'The beaker of water has to be under the bell jar before you pump down (step 3).', step:3},
  noWater:{t:'The beaker is empty', x:'Add 15 mL of distilled water and a stir bar before evacuating (step 2).', step:2},
  noStir:{t:'The stirrer is off', x:'Turn the stirrer on before evacuating and leave it on until equilibration is finished (step 3).', step:3},
  jarUnseated:{t:'The bell jar isn’t seated', x:'The jar is lifted, so the pump is only pulling in room air. Lower the jar onto the rubber base to seal it.', step:3},
  sensorClosed:{t:'The sensor path is closed', x:'Open the stopcock to the pressure sensor (step 4) so Logger Pro shows the bell jar pressure while you pump.', step:4},
  vacPathClosed:{t:'Vacuum is on but nothing is being pumped', x:'Check the 3-way valve and the vacuum stopcock. The path from the vacuum to the bell jar has to be open (steps 5–6).', step:5},
  overPump:{t:'Pumping too long', x:'Stop at 30–40 mm Hg, or as soon as the water boils. Pumping longer only boils away your water.', step:6},
  underPump:{t:'Not evacuated enough', x:'You closed off the vacuum above 45 mm Hg. Pump down to 30–40 mm Hg so the gas mixture gets drawn fully into the jar.', step:6},
  vacOffFirst:{t:'Vacuum turned off while still connected', x:'Close the 3-way valve to the vacuum and the vacuum stopcock before turning the vacuum off (step 7, then step 8). Otherwise air leaks back into the jar.', step:7},
  closeBoth:{t:'Only one vacuum valve closed', x:'Close both the 3-way valve to the vacuum and the vacuum stopcock (step 7). Two closed valves give a reliable seal.', step:7},
  sensorDetachOpen:{t:'Sensor removed with its stopcock open', x:'Close the sensor stopcock before you disconnect the sensor (step 9, then step 10). Otherwise room air rushes into the bell jar.', step:9},
  airLeak:{t:'Vacuum lost', x:'Room air leaked into the bell jar through {route}. Close that path, then evacuate again.', step:6},
  injectNoVac:{t:'The jar isn’t under vacuum', x:'The gas only flows in if the bell jar was evacuated first. Pump down to 30–40 mm Hg before injecting.', step:13},
  sensorAttached:{t:'Sensor still connected during injection', x:'Close the sensor stopcock and disconnect the sensor before adding gas (steps 9–10).', step:10},
  slowClose:{t:'Stopcocks left open', x:'Close the syringe stopcock and the injection-port stopcock right after the gas goes in (step 14), so the reaction happens only in the bell jar.', step:14},
  syringeOpen:{t:'Syringe stopcock open away from the port', x:'Keep the syringe stopcock closed unless the syringe is connected to the injection port. Otherwise NO₂ escapes into the room.', step:13},
  stirOffEquil:{t:'Stirrer off during equilibration', x:'Keep stirring for the full 5–10 minutes so the NO₂ keeps dissolving into the water.', step:16},
};
const SERIOUS = {
  vacuum:{t:'Gas mixture pulled into the vacuum line', x:'The path to the vacuum was open while you added gas, so the NO₂ mixture went into the vacuum line instead of staying in the bell jar.', fix:'Before injecting, turn the 3-way valve so OFF points at the vacuum line, close the vacuum stopcock, and turn off the house vacuum (steps 7–8).'},
  sensor:{t:'Pressure sensor exposed to acid gas', x:'The sensor was still attached with its stopcock open when the NO₂ reached it. The acid damages the sensor.', fix:'Close the sensor stopcock and disconnect the sensor before any gas goes in (steps 9–10).'},

function Tube({t, s, info, flowViz}){
  const sg = s.seg[t.seg], pno2 = 760*sg.b/VOL[t.seg];
  const a = clamp(pno2/22, 0, 1) * .8;
  let cls = null;
  if (flowViz && info){
    const r = info.compOf[t.seg], f = r ? info.flow[r] : 0;
    if (Math.abs(f) > 0.4){ const outward = f < 0; cls = 'flow' + ((outward === (t.dir > 0)) ? '' : ' rev'); }
  }
  return html`<g>
    <path d=${t.d} fill="none" stroke="rgba(222,212,168,.55)" strokeWidth="12" strokeLinecap="round"/>
    <path d=${t.d} fill="none" stroke="rgba(255,255,255,.10)" strokeWidth="6" strokeLinecap="round"/>

    <path d=${t.d} fill="none" stroke="rgba(255,255,255,.45)" strokeWidth="1.6" strokeLinecap="round" transform="translate(-3,-1)"/>
    ${cls && html`<path className=${cls} d=${t.d} fill="none" stroke="rgba(160,230,255,.85)" strokeWidth="3" strokeLinecap="round"/>`}
  </g>`;
}

const OFF_TXT = {up:'toward the bell jar', right:'toward the injection port', down:'toward the vacuum line', left:'at the blank side'};
const OPEN_TXT = {up:'vacuum ↔ injection port connected; bell jar closed', right:'bell jar ↔ vacuum connected; injection port closed', down:'bell jar ↔ injection port connected; vacuum closed', left:'all three paths open'};
function describe(id, s){
  const oc = v => v ? 'Open (handle vertical)' : 'Closed (handle horizontal)';
  switch(id){
    case 'monitor': return ['Computer', s.loggerOpen ? 'Logger Pro is running Exp4AcidRain' : 'Logger Pro is not open', s.loggerOpen ? '' : 'Click to open Exp4AcidRain'];
    case 'washBottle': return ['Distilled water wash bottle', '', s.beaker==='bench' ? 'Click to add 15 mL to the beaker' : ''];
    case 'stirBarItem': return ['Magnetic stir bar', '', 'Click to drop it into the beaker'];
    case 'beaker': return ['30 mL beaker', `${s.water} mL distilled water${s.stirBar?' + stir bar':''}`, s.jarLifted ? (s.beaker==='bench'?'Click to place it under the bell jar':'Click to take it out') : (s.beaker==='bench'?'Lift the bell jar first':'')];
    case 'jar': return ['Bell jar', s.jarLifted ? 'Lifted' : (pJ(s) < 650 ? 'Seated, held down by vacuum' : 'Seated on the rubber base'), s.jarLifted ? 'Click to lower and seat it' : 'Click to lift it'];
    case 'heat': return ['HEAT knob', s.heat ? 'ON — heating' : 'Off', 'Leave this off'];
    case 'stir': return ['STIR knob', s.stir ? 'On — stirring' : 'Off', 'Click to turn the stirrer ' + (s.stir?'off':'on')];
    case 'sensStop': return ['Stopcock to gas pressure sensor', oc(s.sensStop), 'Click to turn'];
    case 'vacStop': return ['Stopcock to vacuum', oc(s.vacStop), 'Click to turn'];
    case 'injStop': return ['Stopcock to injection port', oc(s.injStop), 'Click to turn'];
    case 'synStop': return ['Syringe stopcock', oc(s.synStop), 'Click to turn'];
    case 'threeWay': { const o = offDir(s.angle); return ['3-way valve', `OFF points ${OFF_TXT[o]}: ${OPEN_TXT[o]}`, 'Click to turn 90° clockwise · Shift-click turns counter-clockwise']; }
    case 'houseVac': return ['House vacuum valve', s.houseVac ? 'On' : 'Off', 'Click to turn ' + (s.houseVac?'off':'on')];
    case 'sensor': return ['Gas pressure sensor', s.sensorOn ? 'Connected' : 'Disconnected', s.sensorOn ? 'Click to disconnect' : 'Click to reconnect'];
    case 'syringe': return ['60 mL syringe, NO₂ gas mixture', `${s.synGas.toFixed(0)} mL of gas`, s.syringe==='port' ? 'Click to disconnect' : 'Click to connect it to the injection port'];
    case 'injPort': return ['Injection port', s.syringe==='port' ? 'Syringe connected' : 'Open to the room', s.syringe==='port' ? '' : 'Click to connect the syringe'];
  }
  return null;
}

const VIEWS = [
  ['overview','Whole bench',[0,0,1600,1000]],
  ['valves','Valves',[400,560,600,375]],
  ['jar','Bell jar & stirrer',[880,200,640,400]],
  ['vacuum','House vacuum',[20,360,480,300]],
  ['monitor','Logger Pro',[1100,0,500,312.5]],
  ['items','Bench items',[1080,640,520,325]],
];
const clampCam = c => { const w = clamp(c.w, 280, 1600), h = w/1.6; return {w, h, x:clamp(c.x, 0, 1600-w), y:clamp(c.y, 0, 1000-h)}; };
const fmtT = t => { const m = Math.floor(t/60), x = Math.floor(t%60); return `${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`; };

/* ---------------- App ---------------- */
function App(){
  const S = useRef(initState());
  const [, force] = useState(0);
  const [mode, setMode] = useState('guided');
  const [speed, setSpeed] = useState(1);
  const [intro, setIntro] = useState(true);
  const [toasts, setToasts] = useState([]);
  const [hover, setHover] = useState(null);
  const [labels, setLabels] = useState(true);
  const [flowViz, setFlowViz] = useState(true);
  const [view, setView] = useState('overview');
  const cam = useRef({x:0,y:0,w:1600,h:1000}), camT = useRef({x:0,y:0,w:1600,h:1000});
  const speedR = useRef(1), modeR = useRef('guided'), introR = useRef(true);
  speedR.current = speed; modeR.current = mode; introR.current = intro;
  const svgWrap = useRef(null), tid = useRef(0);

  const toast = (kind, title, text) => {
    const id = ++tid.current;
    setToasts(ts => [...ts.slice(-2), {id, kind, title, text}]);
    setTimeout(() => setToasts(ts => ts.filter(t => t.id !== id)), kind === 'warn' ? 9000 : 6000);
  };
  const logIt = (kind, title, text) => { const s = S.current; s.log.unshift({kind, title, text, t:s.t}); };
  const warn = (id, vars) => {
    const s = S.current; if (s.warned[id] || s.serious || s.complete) return;
    s.warned[id] = true;
    let x = WARN[id].x; if (vars) for (const k in vars) x = x.replace(`{${k}}`, vars[k]);
    s.warned[id] = {x};
    logIt('warn', WARN[id].t, x); toast('warn', WARN[id].t, x);
  };
  const note = (title, text, kind='info') => { logIt(kind, title, text); toast(kind, title, text); };
  const serious = (id, route) => {
    const s = S.current; if (s.serious) return;
    const d = SERIOUS[id];
    s.serious = {t:d.t, x:d.x.replace('{route}', ROUTE_CAP[route] || 'A path'), fix:d.fix};
  };
  const latch = s => { STEPS.forEach((st, i) => { if (!s.latched[i] && st.done(s)) s.latched[i] = true; }); };

  const checks = (s, info, dt) => {
    const P = pJ(s), rJ = info.compOf.J, kinds = info.kinds[rJ] || [];
    const pumping = kinds.includes('pump');
    if (pumping && !s.gasIn){
      if (!s.loggerOpen) warn('noLogger');
      if (s.beaker !== 'jar') warn('noBeaker'); else if (s.water === 0) warn('noWater');
      if (!s.stir) warn('noStir');
      if (s.jarLifted) warn('jarUnseated');
      if (!(s.sensStop && s.sensorOn)) warn('sensorClosed');
      if (P <= 40 && s.beaker === 'jar' && !s.jarLifted) s.reached40 = true;
      if (P < 30){ s.pumpLow += dt; if (s.pumpLow > 25) warn('overPump'); }
    }
    if (s.wasPumping && !pumping && !s.gasIn && s.houseVac && P > 45 && !s.jarLifted) warn('underPump');
    s.wasPumping = pumping;
    if (s.houseVac && !pumping && !s.reached40){ s.vacIdle += dt; if (s.vacIdle > 5) warn('vacPathClosed'); } else s.vacIdle = 0;
    const atm = kinds.filter(k => k === 'jar' || k === 'sensorEnd' || k === 'port');
    if (!s.gasIn && atm.length && s.prevP < 500 && info.flow[rJ] > 0.5){
      if (!(atm[0] === 'sensorEnd' && s.warned.sensorDetachOpen) && !(atm[0]==='jar')) warn('airLeak', {route:ROUTE[atm[0]]});
    }
    s.prevP = P;
    if (kinds.includes('syr') && s.synGas > 0.5){
      if (P > 400) warn('injectNoVac');
      if (s.sensorOn && !s.sensStop) warn('sensorAttached');
    }
    if (!s.gasIn && s.seg.J.b > 1){ s.gasIn = true; note('Gas drawn into the bell jar', 'The brown NO₂ mixture flowed into the evacuated jar. Close both stopcocks now.', 'ok'); }
    s.lostVac += info.lostVac;
    for (const k in info.lostAtm) s.lostAtm[k] = (s.lostAtm[k] || 0) + info.lostAtm[k];
    if (s.sensorOn && s.seg.S.b > 0.02) return serious('sensor');
    if (s.seg.VL.b > 0.02 || s.lostVac > 0.02) return serious('vacuum');
    let worst = null, wv = 0.05; for (const k in s.lostAtm) if (s.lostAtm[k] > wv){ wv = s.lostAtm[k]; worst = k; }
    if (worst) return serious('atm', worst);
    // Any path to the room while NO2 is in (or flowing into) the system is serious, whichever way air moves.
    for (const root in info.kinds){
      const ks = info.kinds[root], open = ks.find(k => k === 'jar' || k === 'sensorEnd' || k === 'port');
      if (!open) continue;
      const brown = SEGS.reduce((a,k) => a + (info.compOf[k] === root ? s.seg[k].b : 0), 0);
      if (brown > 0.3 || ks.includes('syr')) return serious('atm', open);
    }
    if (s.gasIn && s.synGas < 0.5 && s.syringe === 'port' && (s.synStop || s.injStop)){ s.emptyOpen += dt / speedR.current; if (s.emptyOpen > 8) warn('slowClose'); }
    const sealed = kinds.every(k => k === 'leak');
    if (s.gasIn && s.syringe !== 'port' && sealed){
      if (s.stir && s.stirBar) s.equil += dt; else warn('stirOffEquil');
      if (s.equil >= 300 && !s.complete){ s.complete = true; latch(s); }
    }
    if (boilLevel(s) > 0.25 && !s.boilNoted && !s.gasIn){
      s.boilNoted = true;
      if (modeR.current === 'guided') note('The water is boiling', `The jar is near ${P.toFixed(0)} mm Hg. Close off the vacuum now (step 7).`);
    }
  };

  const advance = (s, dt) => {
    let rem = dt;
    while (rem > 1e-6 && !s.serious && !s.complete){
      const h = Math.min(rem, 0.05);
      const info = simStep(s, h); s.info = info;
      s.t += h; rem -= h;
      checks(s, info, h);
      s.histT += h;
      if (s.histT >= 0.5){ s.histT = 0; s.hist.push({t:s.t, p:reading(s)}); if (s.hist.length > 700) s.hist.shift(); }
    }
    s.noise = (Math.random() - 0.5) * 0.2;
    latch(s);
  };

  useEffect(() => {
    let last = performance.now(), iv;
    const loop = () => {
      const now = performance.now();
      const rdt = Math.min(0.1, (now - last)/1000); last = now;
      const s = S.current;
      if (!introR.current && !s.serious && !s.complete) advance(s, rdt * speedR.current);
      const c = cam.current, t = camT.current, k = Math.min(1, rdt*7);
      c.x += (t.x-c.x)*k; c.y += (t.y-c.y)*k; c.w += (t.w-c.w)*k; c.h = c.w/1.6;
      force(x => x + 1);
    };
    iv = setInterval(loop, 1000/45);
    return () => clearInterval(iv);
  }, []);

  /* zoom & pan */
  useEffect(() => {
    const el = svgWrap.current; if (!el) return;
    const pts = new Map(); let pan = null, pinch = null;
    const toScene = (cx, cy) => { const r = el.getBoundingClientRect(), c = cam.current; return [c.x + (cx - r.left)/r.width*c.w, c.y + (cy - r.top)/r.height*c.h]; };
    const zoomAt = (px, py, f) => {
      const c = cam.current, nw = clamp(c.w*f, 280, 1600);
      const nc = clampCam({w:nw, x:px - (px - c.x)*(nw/c.w), y:py - (py - c.y)*(nw/c.w)});
      Object.assign(cam.current, nc); Object.assign(camT.current, nc); setView(null);
    };
    const onWheel = e => { e.preventDefault(); const [px,py] = toScene(e.clientX, e.clientY); zoomAt(px, py, Math.exp(e.deltaY*0.0016)); };
    const down = e => {
      if (e.target.closest && (e.target.closest('.part') || e.target.closest('.zoombar') || e.target.closest('.toasts'))) return;
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
      if (pts.size === 1) pan = {x:e.clientX, y:e.clientY, c:{...cam.current}};
      if (pts.size === 2){ const [a,b] = [...pts.values()]; pinch = {d:Math.hypot(a[0]-b[0], a[1]-b[1])}; pan = null; }
    };
    const move = e => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pinch && pts.size === 2){
        const [a,b] = [...pts.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]);
        const [px,py] = toScene((a[0]+b[0])/2, (a[1]+b[1])/2);
        zoomAt(px, py, pinch.d/d); pinch.d = d;
      } else if (pan){
        const r = el.getBoundingClientRect(), sc = pan.c.w / r.width;
        const nc = clampCam({w:pan.c.w, x:pan.c.x - (e.clientX-pan.x)*sc, y:pan.c.y - (e.clientY-pan.y)*sc});
        Object.assign(cam.current, nc); Object.assign(camT.current, nc);
        if (Math.abs(e.clientX-pan.x) + Math.abs(e.clientY-pan.y) > 4) setView(null);
      }
    };
    const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (pts.size === 0) pan = null; };
    el.addEventListener('wheel', onWheel, {passive:false});
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    return () => { el.removeEventListener('wheel', onWheel); el.removeEventListener('pointerdown', down); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); };
  }, []);
  const goView = (key) => { const v = VIEWS.find(v => v[0] === key)[2]; Object.assign(camT.current, {x:v[0], y:v[1], w:v[2], h:v[3]}); setView(key); };
  const zoomBtn = f => { const c = cam.current; const nc = clampCam({w:c.w*f, x:c.x + c.w*(1-f)/2, y:c.y + c.h*(1-f)/2}); Object.assign(camT.current, nc); setView(null); };

  /* actions */
  const act = (id, e) => {
    const s = S.current; if (s.serious || s.complete || intro) return;
    const P = pJ(s);
    switch(id){
      case 'monitor': if (!s.loggerOpen){ s.loggerOpen = true; logIt('ok','Logger Pro opened','Exp4AcidRain.cmbl is running. Pressure 2 shows the sensor reading.'); } break;
      case 'washBottle':
        if (s.beaker !== 'bench') note('Beaker is under the jar', 'Fill the beaker on the bench before it goes under the bell jar.');
        else if (s.water >= 15) note('Already filled', 'The beaker already has 15 mL of distilled water.');
        else s.water = 15; break;
      case 'stirBarItem': if (s.beaker === 'bench') s.stirBar = true; else note('Beaker is under the jar', 'Add the stir bar while the beaker is on the bench.'); break;
      case 'beaker':
        if (!s.jarLifted) note('The bell jar is in the way', s.beaker === 'bench' ? 'Click the bell jar to lift it first.' : 'Lift the bell jar to reach the beaker.');
        else s.beaker = s.beaker === 'bench' ? 'jar' : 'bench';
        break;
      case 'jar':
        if (s.jarLifted) s.jarLifted = false;
        else if (P < 650) note('Held down by vacuum', `The jar is at ${P.toFixed(0)} mm Hg, so air pressure holds it on the base. It can’t be lifted until it’s back near room pressure.`);
        else s.jarLifted = true;
        break;
      case 'heat': s.heat = !s.heat; if (s.heat) warn('heat'); break;
      case 'stir': s.stir = !s.stir; break;
      case 'sensStop': s.sensStop = !s.sensStop; break;
      case 'vacStop': s.vacStop = !s.vacStop; break;
      case 'injStop': s.injStop = !s.injStop; break;
      case 'threeWay': s.angle += (e && e.shiftKey) ? -90 : 90; break;
      case 'houseVac':
        if (s.houseVac){
          if (connected(s, 'J', 'VL')) warn('vacOffFirst');
          else if (s.reached40 && !(offDir(s.angle) === 'down' && !s.vacStop)) warn('closeBoth');
        }
        s.houseVac = !s.houseVac; break;
      case 'sensor':
        if (s.sensorOn){ if (s.sensStop && (P < 700 || s.gasIn)) warn('sensorDetachOpen'); s.sensorOn = false; }
        else { s.sensorOn = true; s.seg.S = {n:VOL.S, b:0}; }
        break;
      case 'injPort': if (s.syringe !== 'port') s.syringe = 'port'; break;
      case 'syringe':
        if (s.syringe === 'port'){ if (s.synStop && s.synGas > 0.5) warn('syringeOpen'); s.syringe = 'bench'; }
        else s.syringe = 'port';
        break;
      case 'synStop': s.synStop = !s.synStop; if (s.synStop && s.syringe !== 'port' && s.synGas > 0.5) warn('syringeOpen'); break;
    }
    latch(s); force(x => x+1);
  };
  const P = id => ({className:'part', role:'button', tabIndex:0, 'aria-label':(describe(id, S.current)||[id])[0],
    onClick:e => { e.stopPropagation(); setHover(id); act(id, e); },
    onKeyDown:e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(id, e); } },
    onPointerEnter:() => setHover(id), onFocus:() => setHover(id)});

  const restart = () => { S.current = initState(); setToasts([]); setSpeed(1); force(x => x+1); };
  const s = S.current;
  const cur = STEPS.findIndex((_, i) => !s.latched[i]);
  const desc = hover ? describe(hover, s) : null;
  const mistakes = Object.keys(s.warned).map(k => ({...WARN[k], x:s.warned[k].x || WARN[k].x}));
  const skipped = STEPS.map((st,i) => ({...st, i})).filter(st => !s.latched[st.i] && st.i < 15);

  return html`
  <header className="top">
    <div className="brand"><h1>Bell Jar Lab</h1><p>Experiment 3, Acid Rain · Part 2 bell jar setup</p></div>
    <div className="controls">
      <div className="seg" role="group" aria-label="Mode">
        <button aria-pressed=${mode==='guided'} onClick=${() => setMode('guided')}>Guided</button>
        <button aria-pressed=${mode==='practice'} onClick=${() => { setMode('practice'); setFlowViz(false); setLabels(false); }}>Practice</button>
      </div>
      <div className="seg" role="group" aria-label="Simulation speed">
        ${[1,5,20].map(v => html`<button key=${v} aria-pressed=${speed===v} onClick=${() => setSpeed(v)}>${v}×</button>`)}
      </div>
      <button className="btn" onClick=${restart}>Restart</button>
    </div>
  </header>
  <div className="main">
    <section>
      <div className="stage" ref=${svgWrap}>
        <${Scene} s=${s} info=${s.info} P=${P} labels=${labels} flowViz=${flowViz && mode==='guided'} cam=${cam.current}/>
        <div className="zoombar">
          ${VIEWS.map(v => html`<button key=${v[0]} aria-pressed=${view===v[0]} onClick=${() => goView(v[0])}>${v[1]}</button>`)}
          <button aria-label="Zoom in" onClick=${() => zoomBtn(0.75)}>＋</button>
          <button aria-label="Zoom out" onClick=${() => zoomBtn(1.33)}>－</button>
        </div>
        <div className="toasts" aria-live="polite">
          ${toasts.map(t => html`<div key=${t.id} className=${'toast ' + t.kind}><h4>${t.title}</h4><p>${t.text}</p></div>`)}
        </div>
      </div>
      <div className="status">
        ${desc ? html`<span><b>${desc[0]}</b>${desc[1] ? ' · ' + desc[1] : ''}</span>${desc[2] && html`<span>${desc[2]}</span>`}`
               : html`<span>Point at or tap any part to see what it is. Scroll or pinch to zoom; drag the bench to pan.</span>`}
        <span className="clock">Lab time ${fmtT(s.t)}</span>
      </div>
    </section>
    <aside className="rail">
      ${s.gasIn && html`<div className="card equil">
        <div className="head"><h2>Equilibration</h2><span className="lbl">5–10 min</span></div>
        <div className="row"><span>${fmtT(s.equil)} / 05:00</span>${speed !== 20 && html`<button className="btn" onClick=${() => setSpeed(20)}>Skip ahead at 20×</button>`}</div>
        <div className="bar"><i style=${{width:`${clamp(s.equil/300,0,1)*100}%`}}></i></div>
        <p className="hidden-note">${s.syringe === 'port' ? 'Starts once the stopcocks are closed and the syringe is disconnected.' : (s.stir ? 'Stirring. The brown NO₂ fades as it dissolves into the water.' : 'The stirrer is off.')}</p>
      </div>`}
      <div className="card">
        <div className="head"><h2>Procedure</h2><span className="lbl">${Object.keys(s.latched).length} of ${STEPS.length}</span></div>
        ${mode === 'guided' ? html`<ol className="steps">
          ${STEPS.map((st, i) => html`
            ${(i === 0 || STEPS[i-1].sec !== st.sec) && html`<li key=${'s'+i} className="sec">${SECTIONS[st.sec]}</li>`}
            <li key=${i} className=${'step ' + (s.latched[i] ? 'done' : (i === cur ? 'cur' : ''))}>
              <span className="n">${s.latched[i] ? '✓' : i+1}</span>
              <span>${st.text}${i === cur && html`<span className="hint">${st.hint}</span>`}</span>
            </li>`)}
        </ol>` : html`<p className="hidden-note">Steps are hidden in Practice mode. Work from your lab handout. You still get feedback on mistakes, and a full summary at the end.</p>`}
      </div>
      <div className="card">
        <div className="head"><h2>Feedback</h2><span className="lbl">${mistakes.length} mistake${mistakes.length===1?'':'s'}</span></div>
        ${s.log.length ? html`<ul className="log">${s.log.slice(0,30).map((l,i) => html`<li key=${i} className=${l.kind}><span className="t">${fmtT(l.t)}</span><b>${l.title}</b>${l.text}</li>`)}</ul>`
                       : html`<p className="empty">Nothing yet. Notes and mistakes show up here as you work.</p>`}
      </div>
      <div className="card toggles">
        <label><input type="checkbox" id="optLabels" checked=${labels} onChange=${e => setLabels(e.target.checked)}/> Part labels</label>
        <label style=${{opacity: mode==='guided'?1:.5}}><input type="checkbox" id="optFlow" disabled=${mode!=='guided'} checked=${flowViz} onChange=${e => setFlowViz(e.target.checked)}/> Show gas flow</label>
      </div>
    </aside>
  </div>

  ${intro && html`<div className="modal-back"><div className="modal" role="dialog" aria-modal="true">
    <h3>Bell jar setup, before you get to lab</h3>
    <p>This is the bench you'll use for the NO₂ acid-rain reaction. Every valve, stopcock, knob and hose works like the real one, and mistakes have real consequences.</p>
    <ul>
      <li><b>Click</b> a part to use it. The yellow 3-way valve turns 90° per click. The red dots mark open ports, and OFF points at the closed one.</li>
      <li>White stopcocks are <b>open when the handle is vertical</b> and closed when it's horizontal.</li>
      <li>Use the zoom buttons, scroll, or pinch to look closely at the valves.</li>
      <li>A serious mistake (one that would release gas, damage equipment, or ruin the run) ends the attempt and asks you to restart.</li>
    </ul>
    <div className="actions">
      <button className="btn primary" onClick=${() => { setMode('guided'); setIntro(false); }}>Start guided</button>
      <button className="btn" onClick=${() => { setMode('practice'); setLabels(false); setFlowViz(false); setIntro(false); }}>Start practice (no hints)</button>
    </div>
  </div></div>`}

  ${s.serious && html`<div className="modal-back"><div className="modal bad" role="alertdialog" aria-modal="true">
    <span className="lbl">Serious mistake · run stopped</span>
    <h3>${s.serious.t}</h3>
    <p>${s.serious.x}</p>
    <div className="fix"><b>What to do instead:</b> ${s.serious.fix}</div>
    ${mistakes.length > 0 && html`<p style=${{marginTop:'12px'}}><b>Earlier in this run:</b></p><ul>${mistakes.map((m,i) => html`<li key=${i}>${m.t}</li>`)}</ul>`}
    <div className="actions"><button className="btn primary" onClick=${restart}>Restart the setup</button></div>
  </div></div>`}

  ${s.complete && html`<div className="modal-back"><div className="modal good" role="dialog" aria-modal="true">
    <span className="lbl">Run complete</span>
    <h3>Bell jar setup successful</h3>
    <p>You evacuated the bell jar, brought the NO₂ mixture in without letting it escape, and stirred it to equilibrium. You're ready for this part of the lab.</p>
    ${mistakes.length + skipped.length === 0 ? html`<p><b>No mistakes.</b> Every step was done in order.</p>` : html`
      <p><b>Things to fix before lab:</b></p>
      <ul className="mistakes">
        ${mistakes.map((m,i) => html`<li key=${'m'+i}><b>${m.t}</b> (step ${m.step})<br/>${m.x}</li>`)}
        ${skipped.map(st => html`<li key=${'k'+st.i} className="skip"><b>Skipped step ${st.i+1}</b><br/>${st.text}</li>`)}
      </ul>`}
    <div className="actions"><button className="btn primary" onClick=${restart}>Run it again</button></div>
  </div></div>`}
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
